###############################################################################
# Project Metadata
###############################################################################
[project]
name = "openfactcheck"
dynamic = ["version"]
description = "An Open-Source Framework for Fact-Checking and Factuality Evaluation of LLMs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hasan Iqbal", email = "hasan.iqbal@mbzuai.ac.ae" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anthropic>=0.121.0",
    "httpx>=0.28.1",
    "openai>=3.0.0",
    "pydantic>=2.13",
    "pydantic-settings[yaml]>=2.14",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
# api is the shared HTTP layer; local and cloud are the interchangeable repository backends.
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.49",
    "pyjwt[crypto]>=2.13",
    "cryptography>=50.0.0",
]
local = [
    "aiosqlite>=0.22",
    "sqlalchemy[asyncio]>=2.0",
]
cloud = [
    "boto3>=1.43",
]
rarr = [
    "sentence-transformers>=5.7.0",
]

###############################################################################
# Plug-in Entry Points
###############################################################################
[project.entry-points."openfactcheck.components"]
dummy = "openfactcheck.components.dummy:COMPONENTS"
factool = "openfactcheck.components.factool:COMPONENTS"
factcheckgpt = "openfactcheck.components.factcheckgpt:COMPONENTS"

[project.entry-points."openfactcheck.pipelines"]
factool = "openfactcheck.components.nodes.factool:PIPELINE"
factcheckgpt = "openfactcheck.components.nodes.factcheckgpt:PIPELINE"
rarr = "openfactcheck.components.nodes.rarr:PIPELINE"

###############################################################################
# Build System
###############################################################################
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/openfactcheck"]
artifacts = ["src/openfactcheck/**/prompts/*.md"]

###############################################################################
# Testing
###############################################################################
[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]

###############################################################################
# Type Checking
###############################################################################
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/repositories/dynamodb"
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/crypto"
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/repositories/sqlite"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/routers"
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/engine"
reportOperatorIssue = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportArgumentType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/chat/backends/openai"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportCallIssue = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/chat/backends/anthropic"
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false
reportArgumentType = false
reportCallIssue = false

# Optional [rarr] dep (sentence-transformers) is not installed in the base dev
# env; the cross-encoder used for evidence selection is lazily imported and
# mocked in tests, so its symbols are unresolved and pyright cannot infer types here.
[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/components/rarr"
reportMissingImports = false
reportMissingModuleSource = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownParameterType = false
reportUnknownLambdaType = false
reportAttributeAccessIssue = false
reportArgumentType = false

###############################################################################
# Linting
###############################################################################
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
preview = true                # required for DOC rules (pydoclint).
explicit-preview-rules = true # only enable preview rules listed explicitly — don't pull in previews from other groups.
select = [
    # --- Docs (Google convention — see [tool.ruff.lint.pydocstyle] below) ---
    "D",     ## pydocstyle
    "DOC",   ## pydoclint
    # --- Correctness ---
    "E",     ## pycodestyle errors
    "W",     ## pycodestyle warnings
    "F",     ## Pyflakes
    "ASYNC", ## flake8-async
    "S",     ## flake8-bandit
    "BLE",   ## flake8-blind-except
    "B",     ## flake8-bugbear
    "A",     ## flake8-builtins
    "DTZ",   ## flake8-datetimez
    "T10",   ## flake8-debugger
    "FAST",  ## FastAPI
    "ISC",   ## flake8-implicit-str-concat
    "INP",   ## flake8-no-pep420
    "PGH",   ## pygrep-hooks
    "PLE",   ## Pylint Error
    "PLW",   ## Pylint Warning
    # --- Style ---
    "N",     ## pep8-naming
    "UP",    ## pyupgrade
    "I",     ## isort
    "ANN",   ## flake8-annotations
    "FA",    ## flake8-future-annotations
    "FBT",   ## flake8-boolean-trap
    "COM",   ## flake8-commas
    "C4",    ## flake8-comprehensions
    "ERA",   ## eradicate
    "FIX",   ## flake8-fixme
    "ICN",   ## flake8-import-conventions
    "LOG",   ## flake8-logging
    "G",     ## flake8-logging-format
    "PIE",   ## flake8-pie
    "T20",   ## flake8-print
    "RSE",   ## flake8-raise
    "RET",   ## flake8-return
    "SLF",   ## flake8-self
    "SIM",   ## flake8-simplify
    "TID",   ## flake8-tidy-imports
    "TC",    ## flake8-type-checking
    "ARG",   ## flake8-unused-arguments
    "PTH",   ## flake8-use-pathlib
    "FLY",   ## flynt
    "FURB",  ## refurb
    "RUF",   ## Ruff-specific rules
    # --- Complexity ---
    "C90",   ## mccabe
    "PLC",   ## Pylint Convention
    "PLR",   ## Pylint Refactor
    "PERF",  ## Perflint
    "TRY",   ## tryceratops
    # --- Testing ---
    "PT",    ## flake8-pytest-style
]
ignore = [
    # --- Not relevant ---
    "AIR",   ## Airflow
    "CPY",   ## flake8-copyright
    "DJ",    ## flake8-django
    "EXE",   ## flake8-executable
"INT",   ## flake8-gettext
    "NPY",   ## NumPy-specific rules
    "PD",    ## pandas-vet
    "PYI",   ## flake8-pyi
    # --- By choice ---
"S104",  ## possible-binding-to-all-interfaces (server config needs 0.0.0.0)
    "TRY003", ## raise-vanilla-args (same rationale as EM)
    "EM",    ## flake8-errmsg
    "ARG002", ## unused-method-argument (fires on protocol impls with unused params)
"COM812", ## missing-trailing-comma (formatter handles this)
    "Q",     ## flake8-quotes (formatter handles this)
    "SLOT",  ## flake8-slots (Pydantic handles this)
    "TD",    ## flake8-todos (using TODO.md instead)
    "YTT",   ## flake8-2020 (not doing version checks)
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"src/openfactcheck/api/*" = [
    "TCH",  ## Pydantic needs to evaluate types at runtime.
]
"src/openfactcheck/engine/**" = [
    "D",    ## engine docstrings deferred — not a current priority.
    "DOC",
]
"src/openfactcheck/engine/handlers/*" = [
    "PLR0911",  ## dispatch-style handlers have many return statements.
    "S311",     ## Blockly handlers use random for non-crypto purposes.
]
"src/openfactcheck/chat/backends/*" = [
    "PLC0415",  ## lazy framework imports are the design of backends.
]
"src/openfactcheck/graph/**" = [
    "UP046",  ## PEP-696 type-param defaults need typing_extensions + Generic[] on 3.12; native syntax is 3.13+.
]
"src/openfactcheck/integrations/**" = [
    "PLR0913",  ## service clients take many keyword-only config knobs.
]
"tests/**" = [
    "D",    ## test names already describe intent; no need for docstrings.
    "DOC",
]

[tool.ruff.lint.pydocstyle]
convention = "google"  # docstring standard for OpenFactCheck — pairs with mkdocstrings for future doc generation.

###############################################################################
# Formatting
###############################################################################
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

###############################################################################
# Development Dependencies
###############################################################################
[dependency-groups]
dev = [
    "openfactcheck[api,local,cloud]",
    "pyright>=1.1",
    "pre-commit>=4.6",
    "pytest>=9.1.0",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "pytest-mock>=3.15",
    "httpx>=0.28",
    "boto3-stubs[dynamodb,kms]>=1.43",
    "moto[dynamodb]>=5.2",
    "ruff>=0.16.2",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
    "neoteroi-mkdocs>=1.2",
]
