###############################################################################
# Project Metadata
###############################################################################
[project]
name = "openfactcheck"
dynamic = ["version"]
description = "An Open-Source Framework for Fact-Checking and Factuality Evaluation of LLMs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hasan Iqbal", email = "hasan.iqbal@mbzuai.ac.ae" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings[yaml]>=2.9",
    "langgraph>=1.1",
    "langchain-core>=1.2",
    "langchain-litellm>=0.6",
    "litellm>=1.83",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "PyJWT[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.21",
    "mangum>=0.19",
]
cloud = [
    "boto3>=1.35",
]

###############################################################################
# Build System
###############################################################################
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/openfactcheck"]

###############################################################################
# Testing
###############################################################################
[tool.pytest.ini_options]
pythonpath = "src"

###############################################################################
# Type Checking
###############################################################################
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/repositories/dynamodb"
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/repositories/sqlite"
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportAttributeAccessIssue = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/api/routers"
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "src/openfactcheck/engine"
reportOperatorIssue = false
reportUnknownVariableType = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportArgumentType = false

###############################################################################
# Linting
###############################################################################
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = [
    # --- Correctness ---
    "E",     ## pycodestyle errors
    "W",     ## pycodestyle warnings
    "F",     ## Pyflakes
    "ASYNC", ## flake8-async
    "S",     ## flake8-bandit
    "BLE",   ## flake8-blind-except
    "B",     ## flake8-bugbear
    "A",     ## flake8-builtins
    "DTZ",   ## flake8-datetimez
    "T10",   ## flake8-debugger
    "FAST",  ## FastAPI
    "ISC",   ## flake8-implicit-str-concat
    "INP",   ## flake8-no-pep420
    "PGH",   ## pygrep-hooks
    "PLE",   ## Pylint Error
    "PLW",   ## Pylint Warning
    # --- Style ---
    "N",     ## pep8-naming
    "UP",    ## pyupgrade
    "I",     ## isort
    "ANN",   ## flake8-annotations
    "FA",    ## flake8-future-annotations
    "FBT",   ## flake8-boolean-trap
    "COM",   ## flake8-commas
    "C4",    ## flake8-comprehensions
    "ERA",   ## eradicate
    "FIX",   ## flake8-fixme
    "ICN",   ## flake8-import-conventions
    "LOG",   ## flake8-logging
    "G",     ## flake8-logging-format
    "PIE",   ## flake8-pie
    "T20",   ## flake8-print
    "RSE",   ## flake8-raise
    "RET",   ## flake8-return
    "SLF",   ## flake8-self
    "SIM",   ## flake8-simplify
    "TID",   ## flake8-tidy-imports
    "TC",    ## flake8-type-checking
    "ARG",   ## flake8-unused-arguments
    "PTH",   ## flake8-use-pathlib
    "FLY",   ## flynt
    "FURB",  ## refurb
    "RUF",   ## Ruff-specific rules
    # --- Complexity ---
    "C90",   ## mccabe
    "PLC",   ## Pylint Convention
    "PLR",   ## Pylint Refactor
    "PERF",  ## Perflint
    "TRY",   ## tryceratops
    # --- Testing ---
    "PT",    ## flake8-pytest-style
]
ignore = [
    # --- Docs (temporarily disabled) ---
    "D",     ## pydocstyle
    "DOC",   ## pydoclint
    # --- Not relevant ---
    "AIR",   ## Airflow
    "CPY",   ## flake8-copyright
    "DJ",    ## flake8-django
    "EXE",   ## flake8-executable
"INT",   ## flake8-gettext
    "NPY",   ## NumPy-specific rules
    "PD",    ## pandas-vet
    "PYI",   ## flake8-pyi
    # --- By choice ---
"S104",  ## possible-binding-to-all-interfaces (server config needs 0.0.0.0)
    "TRY003", ## raise-vanilla-args (same rationale as EM)
    "EM",    ## flake8-errmsg
"COM812", ## missing-trailing-comma (formatter handles this)
    "Q",     ## flake8-quotes (formatter handles this)
    "SLOT",  ## flake8-slots (Pydantic handles this)
    "TD",    ## flake8-todos (using TODO.md instead)
    "YTT",   ## flake8-2020 (not doing version checks)
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"src/openfactcheck/api/*" = [
    "TCH",  ## Pydantic needs to evaluate types at runtime.
]
"src/openfactcheck/engine/handlers/*" = [
    "PLR0911",  ## dispatch-style handlers have many return statements.
    "S311",     ## Blockly handlers use random for non-crypto purposes.
]

###############################################################################
# Formatting
###############################################################################
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

###############################################################################
# Development Dependencies
###############################################################################
[dependency-groups]
dev = [
    "openfactcheck[api,cloud]",
    "pyright>=1.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26",
    "pytest-mock>=3.14",
    "httpx>=0.28",
    "boto3-stubs[dynamodb]>=1.35",
    "moto[dynamodb]>=5.1",
    "ruff>=0.15.8",
]
