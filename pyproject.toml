###############################################################################
# Project Metadata
###############################################################################
[project]
name = "openfactcheck"
dynamic = ["version"]
description = "An Open-Source Framework for Fact-Checking and Factuality Evaluation of LLMs"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Hasan Iqbal", email = "hasan.iqbal@mbzuai.ac.ae" }]
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings[yaml]>=2.13.1",
    "langgraph>=1.1",
    "langchain-core>=1.2",
    "litellm>=1.83",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.44.0",
    "PyJWT[crypto]>=2.10",
    "sqlalchemy[asyncio]>=2.0.49",
    "aiosqlite>=0.21",
    "mangum>=0.19",
]
cloud = [
    "boto3>=1.42.88",
]

###############################################################################
# Build System
###############################################################################
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "regex"
path = "VERSION"
pattern = "(?P<version>.+)"

[tool.hatch.build.targets.wheel]
packages = ["src/openfactcheck"]

###############################################################################
# Testing
###############################################################################
[tool.pytest.ini_options]
pythonpath = "src"

###############################################################################
# Type Checking
###############################################################################
[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src"]
venvPath = "."
venv = ".venv"

###############################################################################
# Linting
###############################################################################
[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "T20", "LOG", "ANN", "FA"]
ignore = ["E712", "ANN401"]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

###############################################################################
# Formatting
###############################################################################
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

###############################################################################
# Development Dependencies
###############################################################################
[dependency-groups]
dev = [
    "openfactcheck[api,cloud]",
    "pyright>=1.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=0.26",
    "httpx>=0.28",
    "boto3-stubs[dynamodb]>=1.42.88",
    "moto[dynamodb]>=5.1.22",
    "ruff>=0.15.10",
]
