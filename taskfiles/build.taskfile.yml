# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: "3"

tasks:
  lambda:
    desc: Build all Lambda deployment zips (one per deployments/artifacts/*/)
    cmds:
      - |
        source taskfiles/build.helpers.sh 2>/dev/null || source ./taskfiles/build.helpers.sh
        build_all
        write_tfvars

  lambda:force:
    desc: Build all Lambda deployment zips, ignoring the change hash
    cmds:
      - |
        source taskfiles/build.helpers.sh 2>/dev/null || source ./taskfiles/build.helpers.sh
        build_all force
        write_tfvars

  clean:
    desc: Remove all Lambda build artifacts
    cmds:
      - |
        source taskfiles/build.helpers.sh 2>/dev/null || source ./taskfiles/build.helpers.sh
        clean_all

  default:
    desc: Show available build tasks
    cmds:
      - task: :print:info
        vars:
          MSG: "Usage: task build:lambda [force] — builds every deployments/artifacts/*/"
