version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Only major and minor updates open PRs; skip routine patch bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
    ignore:
      # Only major and minor updates open PRs; skip routine patch bumps.
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]
