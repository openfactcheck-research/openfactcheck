name: CI Integration

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: task dev:lint

  deploy:
    name: Deploy to Integration
    needs: [lint]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_INTEGRATION }}
          aws-region: us-east-1

      - name: Deploy to integration
        run: task deploy TARGET=integration
