name: CI Production

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  id-token: write

jobs:
  lint:
    name: Lint
    uses: ./.github/workflows/lint.yml

  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Publish to PyPI
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Run checks
        run: task release:check

      - name: Build package
        run: uvx hatch build

      - name: Publish to PyPI
        env:
          PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
        run: >
          uvx hatch publish
          -u __token__
          -a ${{ secrets.PYPI_TOKEN }}
          --no-prompt

  deploy:
    name: Deploy to Production
    needs: [publish]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Task
        uses: go-task/setup-task@v2

      - name: Write deployment config
        run: |
          mkdir -p deployments/environments deployments/accounts
          echo '${{ secrets.PRODUCTION_TFVARS }}' > deployments/environments/production.tfvars.json
          echo '${{ secrets.HASANIQBAL_DEV_BACKEND_CONF }}' > deployments/accounts/hasaniqbal-dev.backend.conf

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PRODUCTION }}
          aws-region: us-east-1

      - name: Write AWS profile
        run: |
          aws configure set aws_access_key_id "$AWS_ACCESS_KEY_ID" --profile hasaniqbal-dev
          aws configure set aws_secret_access_key "$AWS_SECRET_ACCESS_KEY" --profile hasaniqbal-dev
          aws configure set aws_session_token "$AWS_SESSION_TOKEN" --profile hasaniqbal-dev
          aws configure set region us-east-1 --profile hasaniqbal-dev

      - name: Build and deploy
        run: task deploy TARGET=production AUTO_APPROVE=true
